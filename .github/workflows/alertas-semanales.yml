name: Alerta semanal de ventas

on:
  # Se dispara DESPUÉS de que el workflow de datos actualiza ventas-2026.json.
  # workflow_run solo se activa en la rama por defecto (main).
  workflow_run:
    workflows: ["Actualizar datos de ventas"]
    types: [completed]
    branches: [main]

  # Todos los lunes a las 6:00 p. m. de Lima (23:00 UTC).
  schedule:
    - cron: '0 23 * * 1'

  # Ejecución manual desde la UI de GitHub Actions.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulación (no envía email real)'
        type: boolean
        default: true
      reenviar:
        description: 'Reenviar aunque el correo de esta semana ya salió (para pruebas)'
        type: boolean
        default: false

permissions:
  contents: write   # necesario para commitear alertas-envios.json

# Dos alertas a la vez leerían el mismo registro de envíos y la segunda pisaría la huella de la
# primera. En fila, cada una arranca con el registro que dejó la anterior.
concurrency:
  group: alerta-ventas
  cancel-in-progress: false

jobs:
  alerta:
    # Si viene por workflow_run, solo correr si el upstream fue exitoso.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # token con permisos de push para el commit de envios
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ejecutar alerta semanal
        id: alerta
        run: node scripts/alertas.js ${{ github.event_name == 'workflow_dispatch' && inputs.reenviar && '--force' || '' }}
        env:
          # lunes: una vez por semana. ventas: después de cada lectura del archivo de ventas, solo si
          # cambiaron las cifras. manual: como el lunes (con "reenviar" se manda igual).
          ALERTA_MOTIVO: ${{ github.event_name == 'schedule' && 'lunes' || github.event_name == 'workflow_run' && 'ventas' || 'manual' }}
          # Lista de correos de la ruedita de Notificaciones (Web App alertas-destinatarios.gs).
          RB_ALERTAS_URL: ${{ secrets.RB_ALERTAS_URL }}
          RB_ALERTAS_TOKEN: ${{ secrets.RB_ALERTAS_TOKEN }}
          # Correo del hosting (alertas@limaretail.com). Si faltan, se usa Resend.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # URL del tablero en el hosting (variable del repo); si falta se usa la de alertas-config.json.
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # En dispatch manual, respeta el input dry_run. En schedule/workflow_run, envía real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      - name: Registrar envío en el repo
        # Solo si el paso anterior tuvo éxito Y no fue dry-run
        if: >-
          success() &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REGISTRO="data/alertas-envios.json"
          git add $REGISTRO
          if git diff --cached --quiet; then
            echo "Sin cambios en alertas-envios.json (semana ya registrada)"
            exit 0
          fi
          WEEK=$(TZ='America/Lima' date +'%Y-W%V')
          # El 4/11/2026 el correo salió y este push murió con «! [rejected] main -> main»: la
          # corrida de ventas empujó primero. Y si la huella no queda guardada, la lectura siguiente
          # vuelve a ver las cifras «cambiadas» y manda el correo otra vez. Mismo remedio que en los
          # workflows de datos: el registro lo escribe alertas.js entero, así que no se mezcla línea
          # a línea; se guarda aparte, se parte de origin/main y se vuelve a poner encima.
          mkdir -p "$RUNNER_TEMP/registro"
          cp $REGISTRO "$RUNNER_TEMP/registro/"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP"/registro/*.json data/
            git add $REGISTRO
            if git diff --cached --quiet; then
              echo "Otra corrida ya registró este envío"
              exit 0
            fi
            git commit -m "chore: alerta de ventas ${WEEK} enviada"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Otra corrida empujó primero; reintento ${intento}"
          done
          echo "No se pudo registrar el envío después de tres intentos" >&2
          exit 1
