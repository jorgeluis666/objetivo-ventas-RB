name: Deploy a GitHub Pages

# Publica el tablero en https://royalbaby.limaretail.com (dominio configurado en Settings > Pages;
# con Actions GitHub no lee el archivo CNAME, que va igual en dist/). Cifra dist/index.html con el secret
# RB_PAGE_PASSWORD: sin esa clave el HTML publicado no se puede leer. Solo se sube dist/
# (index.html, assets/ y CNAME): data/, scripts/ y README no se publican.
#
# workflow_run: los commits de datos de "Actualizar datos de ventas" y "Sincronizar inversión publicitaria"
# los hace GITHUB_TOKEN y esos push no disparan otros workflows, así que el deploy se encadena al terminar.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar datos de ventas", "Sincronizar inversión publicitaria"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          RB_PAGE_PASSWORD: ${{ secrets.RB_PAGE_PASSWORD }}
        run: |
          # Sin clave no se publica: el tablero quedaría abierto a cualquiera con el enlace.
          if [ -z "$RB_PAGE_PASSWORD" ]; then echo "::error::Falta el secret RB_PAGE_PASSWORD"; exit 1; fi
          node scripts/build.js
          # Último control: lo que se sube tiene que ser la pantalla de acceso, no el tablero en claro.
          grep -q 'id="gate-payload"' dist/index.html || { echo "::error::dist/index.html no salió cifrado"; exit 1; }
          if grep -qE 'RB_(VENTAS|ADS|OBJETIVOS|GASTO)_DATA' dist/index.html; then echo "::error::dist/index.html trae los datos en claro"; exit 1; fi
          if [ -e dist/data ]; then echo "::error::dist/ no debe llevar data/"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
        id: deployment
