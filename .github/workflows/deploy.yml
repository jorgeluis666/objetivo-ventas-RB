name: Deploy a GitHub Pages

# Publica el tablero en https://royalbaby.limaretail.com (dominio configurado en Settings > Pages;
# con Actions GitHub no lee el archivo CNAME, que va igual en dist/). Cifra dist/index.html con el secret
# RB_PAGE_PASSWORD: sin esa clave el HTML publicado no se puede leer. Solo se sube dist/
# (index.html, assets/ y CNAME): data/, scripts/ y README no se publican.
#
# workflow_run: los commits de datos de "Actualizar datos de ventas", "Sincronizar objetivos comerciales",
# "Sincronizar inversión publicitaria" y "Reportes automáticos" (la lista de la carpeta de reportes)
# los hace GITHUB_TOKEN y esos push no disparan otros workflows, así que el deploy se encadena al terminar.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar datos de ventas", "Sincronizar objetivos comerciales", "Sincronizar inversión publicitaria", "Reportes automáticos"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build
        env:
          RB_PAGE_PASSWORD: ${{ secrets.RB_PAGE_PASSWORD }}
          # Lista de correos de las alertas (ruedita de Notificaciones): solo queda dentro del HTML cifrado.
          RB_ALERTAS_URL: ${{ secrets.RB_ALERTAS_URL }}
          RB_ALERTAS_TOKEN: ${{ secrets.RB_ALERTAS_TOKEN }}
          # Lector de las carpetas privadas para los botones Sincronizar: solo dentro del HTML cifrado.
          RB_DRIVE_SCRIPT_URL: ${{ secrets.RB_DRIVE_SCRIPT_URL }}
          RB_DRIVE_READ_KEY: ${{ secrets.RB_DRIVE_READ_KEY }}
        run: |
          # Sin clave no se publica: el tablero quedaría abierto a cualquiera con el enlace.
          if [ -z "$RB_PAGE_PASSWORD" ]; then echo "::error::Falta el secret RB_PAGE_PASSWORD"; exit 1; fi
          node scripts/build.js
          # Último control: lo que se sube tiene que ser la pantalla de acceso, no el tablero en claro.
          grep -q 'id="gate-payload"' dist/index.html || { echo "::error::dist/index.html no salió cifrado"; exit 1; }
          if grep -qE 'RB_(VENTAS|OBJETIVOS|GASTO)_DATA|RB_ALERTAS|RB_DRIVE_LECTURA' dist/index.html; then echo "::error::dist/index.html trae los datos en claro"; exit 1; fi
          if [ -e dist/data ]; then echo "::error::dist/ no debe llevar data/"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar el artefacto verificado mediante la API de Pages
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.ARTIFACT_NAME;
            const {owner, repo} = context.repo;
            let artifact;
            for (let i=0; i<12; i++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId, per_page: 100});
              const matches = response.data.artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length > 1) throw new Error('Artefacto ambiguo');
              if (matches.length === 1) { artifact = matches[0]; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('Artefacto de Pages no disponible');
            const oidc_token = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token
            });
            core.setOutput('page_url', deployment.page_url);
            core.info('Despliegue creado: ' + deployment.id);
            for (let i=0; i<60; i++) {
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {owner, repo, deploymentId: deployment.id});
              if (status.status === 'succeed') { core.info('Publicación verificada'); return; }
              if (['deployment_failed','deployment_content_failed','deployment_cancelled','deployment_lost','failed','cancelled'].includes(status.status)) throw new Error('Pages: ' + status.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages no terminó en cinco minutos');
