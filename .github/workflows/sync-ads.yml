name: Sincronizar inversión publicitaria

# Lee las carpetas de Drive de Meta Ads ("Meta Files") y Google Ads ("Google Files")
# con scripts/sync-ads.js y commitea data/ads-2026.json si cambió. Lo usa el módulo
# Gasto publicitario del tablero.
#
# Después recorre la carpeta de artes con scripts/sync-artes.js y commitea
# data/artes-2026.json: es el arte que el módulo Anuncios pone al lado de cada anuncio.
# Van juntos porque las piezas se suben a Drive al mismo ritmo que los informes.
#
# Al final lista la carpeta de reportes con scripts/sync-reportes.js y commitea
# data/reportes-2026.json: es el índice del módulo Archivo de Reportes.
#
# Lee Drive cuando lo dispara el Apps Script, cuatro veces al día y al mismo segundo
# (11:23, 15:32, 18:29 y 23:30 UTC), más una corrida de respaldo a las 05:26 UTC por si el Apps
# Script se cae. Nexus publica Google y Meta a las 06, 13 y 18 de Lima.
# La captura conserva su propia hora de origen.
# No hay botón en el tablero: dispararlo desde el navegador exigiría un token de GitHub y el
# tablero lo abren clientes.
#
# Las carpetas de Meta Ads y Google Ads son privadas: sync-ads.js las lee por el Apps
# Script de Royal Baby (secrets RB_DRIVE_SCRIPT_URL y RB_DRIVE_READ_KEY). Artes y Reportes
# siguen compartidas por enlace (el tablero muestra sus miniaturas) y se leen por la vista
# pública.
#
# Si un archivo no se puede descargar o leer, ese mes y plataforma queda como estaba en
# el JSON anterior, el resto se actualiza y el fallo sale como anotación (warning) de la
# corrida y en `pending`. Si no se puede listar una carpeta, el script no escribe nada y
# sale con código 1: el workflow queda en rojo y el deploy no se dispara (deploy.yml
# solo sigue a corridas en verde).

on:
  # Sin cron de GitHub, desde el 3/11/2026. Estaba declarado a las 11:30, 18:30 y 23:30 UTC y en los
  # cinco días anteriores no entró ni una vez a su hora: el de las 23:30 llegaba entre las 2 y las 4
  # de la madrugada, el de las 11:30 sobre las 16:00 o 17:00, y varios días se saltaba una franja.
  # El Apps Script, en cambio, dispara a los mismos segundos todos los días. Dos programadores para
  # el mismo trabajo además chocaban: el 3/11 entraron con treinta segundos de diferencia y la
  # segunda corrida murió al rebasar.
  workflow_dispatch: {}

  # Una sola corrida de respaldo al día, por si el Apps Script deja de disparar: entonces nadie
  # leería Drive y el tablero se congelaría sin que el archivo lo delate, porque su fecha es la del
  # sync y no la de la captura. A las 00:26 de Lima, en mitad del hueco más grande entre los cuatro
  # disparos del Apps Script (23:30 y 11:23 UTC): aunque GitHub la lance con dos horas de retraso,
  # que es lo normal, sigue sin pisar a ninguno. Y si llegara a coincidir, el grupo de concurrencia
  # la pone en fila en vez de matarla. Casi siempre no escribe nada: a esa hora ya se leyó la
  # captura de las 18:00, así que no commitea y no encadena un despliegue.
  schedule:
    - cron: '26 5 * * *'

permissions:
  contents: write

concurrency:
  group: sync-ads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validar contrato Nexus Meta
        run: node scripts/test-nexus-meta.js

      - name: Leer las carpetas de Meta Ads y Google Ads
        env:
          # Las carpetas son privadas: las lee el Apps Script de Royal Baby con su clave.
          RB_DRIVE_SCRIPT_URL: ${{ secrets.RB_DRIVE_SCRIPT_URL }}
          RB_DRIVE_READ_KEY: ${{ secrets.RB_DRIVE_READ_KEY }}
          RB_DRIVE_API_KEY: ${{ secrets.RB_DRIVE_API_KEY }}
        run: node scripts/sync-ads.js

      - name: Leer la carpeta de artes
        env:
          RB_DRIVE_API_KEY: ${{ secrets.RB_DRIVE_API_KEY }}
        run: node scripts/sync-artes.js

      - name: Leer la carpeta de reportes
        env:
          RB_DRIVE_API_KEY: ${{ secrets.RB_DRIVE_API_KEY }}
        run: node scripts/sync-reportes.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVOS="data/ads-2026.json data/artes-2026.json data/reportes-2026.json"
          git add $ARCHIVOS
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos de anuncios, artes ni reportes"
            exit 0
          fi
          TODAY=$(TZ='America/Lima' date +'%Y-%m-%d')
          # Estos JSON se regeneran enteros en cada corrida, no se editan a mano. Si otra corrida
          # empujó mientras esta leía Drive, mezclarlos línea a línea con «git pull --rebase» da
          # conflicto y la corrida muere en rojo: son dos fotos completas de lo mismo, y vale la del
          # que acaba de leer. Pasa de verdad — el 3/11/2026, con el cron y un workflow_dispatch
          # lanzados con treinta segundos de diferencia. Por eso se guardan aparte, se parte de
          # origin/main y se vuelven a poner encima.
          mkdir -p "$RUNNER_TEMP/datos"
          cp $ARCHIVOS "$RUNNER_TEMP/datos/"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP"/datos/*.json data/
            git add $ARCHIVOS
            if git diff --cached --quiet; then
              echo "Otra corrida ya dejó estos mismos datos"
              exit 0
            fi
            git commit -m "data: anuncios y artes ${TODAY}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Otra corrida empujó primero; reintento ${intento}"
          done
          echo "No se pudo empujar después de tres intentos" >&2
          exit 1
