name: Sincronizar objetivos comerciales

# Lee la hoja de la carpeta de Drive "Objetivos Royal Baby" con scripts/sync-objetivos.js y
# commitea data/objetivos-2026.json. Es la zona de objetivos del módulo Objetivos 2026; también
# la usan Proyecciones y el correo semanal.
#
# Corre todos los días a las 10:30 de Lima, lanzado por el Apps Script scripts/disparar-actualizacion.gs
# (el cron de las 06:05 queda de respaldo), y a mano (Run workflow).
# En el tablero, el botón Sincronizar de la zona de objetivos lee la misma hoja al instante,
# solo en ese navegador.
#
# La carpeta es privada: el script la lee por el Apps Script de Royal Baby
# (scripts/disparar-actualizacion.gs, secrets RB_DRIVE_SCRIPT_URL y RB_DRIVE_READ_KEY).
#
# Si la hoja no se puede leer (no está compartida, faltan los meses o la columna PROYECCIÓN, o
# aparece un canal desconocido), el script no escribe nada y sale con código 1: queda publicado
# el último JSON válido y el deploy no se dispara.

on:
  schedule:
    # 06:05 Lima = 11:05 UTC
    - cron: '5 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-objetivos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Leer la carpeta de objetivos
        env:
          # Las carpetas son privadas: las lee el Apps Script de Royal Baby con su clave.
          RB_DRIVE_SCRIPT_URL: ${{ secrets.RB_DRIVE_SCRIPT_URL }}
          RB_DRIVE_READ_KEY: ${{ secrets.RB_DRIVE_READ_KEY }}
          RB_DRIVE_API_KEY: ${{ secrets.RB_DRIVE_API_KEY }}
        run: node scripts/sync-objetivos.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVOS="data/objetivos-2026.json"
          git add $ARCHIVOS
          if git diff --cached --quiet; then
            echo "Sin cambios en data/objetivos-2026.json"
            exit 0
          fi
          TODAY=$(TZ='America/Lima' date +'%Y-%m-%d')
          # Este JSON se regenera entero en cada corrida, no se edita a mano. Si otra corrida empujó
          # mientras esta leía, mezclarlo línea a línea con «git pull --rebase» da conflicto: son dos
          # fotos completas de lo mismo, y vale la del que acaba de leer. Por eso se guarda aparte,
          # se parte de origin/main y se vuelve a poner encima.
          mkdir -p "$RUNNER_TEMP/datos"
          cp $ARCHIVOS "$RUNNER_TEMP/datos/"
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP"/datos/*.json data/
            git add $ARCHIVOS
            if git diff --cached --quiet; then
              echo "Otra corrida ya dejó estos mismos datos"
              exit 0
            fi
            git commit -m "data: objetivos ${TODAY}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Otra corrida empujó primero; reintento ${intento}"
          done
          echo "No se pudo empujar después de tres intentos" >&2
          exit 1
