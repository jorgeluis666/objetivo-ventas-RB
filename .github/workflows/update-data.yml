name: Actualizar datos de ventas

# Genera data/ventas-2026.json con scripts/fetch-data.js:
#   2026 → la hoja de la carpeta de Drive "Ventas Royal Baby - 2026" (compartida por enlace,
#          sin credenciales). Es la zona de ventas del módulo Objetivos y la fuente de todo el tablero.
#   2025 → el Google Sheet de 2025 por la API de Sheets (secret SERVICE_ACCOUNT_JSON).
#
# Corre todos los días a las 06:00 de Lima y a mano (Run workflow). En el tablero, el botón
# Sincronizar de la zona de ventas lee la misma hoja al instante, solo en ese navegador.
#
# Si una lectura falla, el script no escribe nada y sale con código 1: queda publicado el último
# JSON válido y el deploy no se dispara (deploy.yml solo sigue a corridas en verde).

on:
  schedule:
    # 06:00 Lima = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write service account credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$SERVICE_ACCOUNT_JSON" > credentials/service-account.json

      - name: Leer ventas (Drive 2026 + Sheet 2025)
        env:
          RB_DRIVE_API_KEY: ${{ secrets.RB_DRIVE_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Remove credentials (safety)
        if: always()
        run: rm -f credentials/service-account.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ventas-2026.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data/ventas-2026.json"
            exit 0
          fi
          TODAY=$(TZ='America/Lima' date +'%Y-%m-%d')
          git commit -m "data: ventas ${TODAY}"
          # Por si otro workflow de datos commiteó mientras tanto
          git pull --rebase origin main
          git push
