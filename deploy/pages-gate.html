<!DOCTYPE html>
<!-- Plantilla: scripts/build.js la usa cuando hay RB_PAGE_PASSWORD y rellena el marcador de gate-payload con el
     tablero cifrado (AES-256-GCM, llave PBKDF2-SHA256 de la clave). Sin la clave este HTML no revela nada del tablero. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Royal Baby · Acceso</title>
<link rel="icon" type="image/jpeg" href="assets/logo-royal-baby.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<!-- Diseño y azul de la pantalla de acceso de LR Suite y de la agencia, con la marca Royal Baby y el título que ya
     tenía este tablero. La clave no está en el código: es la que descifra el tablero. -->
<style>
  :root { --accent: #2563eb; --accent-dark: #1d4ed8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; overflow: hidden; background: #0f172a; color: #0f172a; }
  .panel { width: 400px; max-width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    padding: 48px 44px; overflow-y: auto; background: #fff; }
  .inner { width: 100%; max-width: 312px; }
  .brand { margin-bottom: 16px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .title { margin: 0 0 28px; font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; color: #0f172a; }
  .divider { width: 40px; height: 3px; margin-bottom: 36px; border-radius: 2px; background: var(--accent); }
  form { display: flex; flex-direction: column; gap: 12px; }
  input { width: 100%; padding: 12px 16px; border: 1.5px solid #dce3ef; border-radius: 8px; outline: none; background: #e8f0fe;
    color: #0f172a; font: inherit; font-size: 14px; transition: border-color .15s; }
  input::placeholder { color: #64748b; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit;
    font-size: 14px; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 18px; margin-top: 12px; font-size: 12px; color: #dc2626; }
  /* El degradado queda debajo por si la imagen falta o todavía no carga. */
  .bg { flex: 1; min-width: 0; background-color: #0f172a;
    background-image: linear-gradient(140deg, var(--accent) 0%, var(--accent-dark) 38%, #0f172a 100%);
    background-size: cover; background-position: center; filter: grayscale(20%); }
  @media (max-width: 768px) {
    .panel { width: 100%; padding: 32px 24px; }
    .inner { max-width: 360px; }
    .title { font-size: 30px; margin-bottom: 22px; }
    .divider { margin-bottom: 26px; }
    .bg { display: none; }
  }
  @media (max-height: 520px) {
    .panel { align-items: flex-start; padding: 24px; }
    .title { font-size: 26px; margin-bottom: 18px; }
    .divider { margin-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="inner">
    <div class="brand">Royal Baby</div>
    <h1 class="title">Centro de<br>Control</h1>
    <div class="divider"></div>
    <form id="gate" autocomplete="off">
      <input type="password" id="gate-password" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <button type="submit" id="gate-submit">Ingresar</button>
    </form>
    <div class="error" id="gate-error" role="alert"></div>
  </div>
</div>
<div class="bg" id="gate-bg"></div>
<script type="application/json" id="gate-payload">__PAYLOAD__</script>
<script>
// IIFE: document.open() conserva el mismo window y un const global chocaría con los scripts del tablero.
(function () {
  var payload = JSON.parse(document.getElementById('gate-payload').textContent);
  // La sal cambia en cada build: después de un deploy la llave guardada ya no sirve y se pide la clave otra vez.
  var storageKey = 'rb-gate-key-' + payload.salt;
  var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (arr) { return btoa(String.fromCharCode.apply(null, arr)); };

  function derive(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations }, base, 256);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }

  function show(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data)); })
      .then(function (plain) {
        // Se guarda la llave derivada (no la clave) para no pedirla en cada recarga de esta pestaña.
        try { sessionStorage.setItem(storageKey, toB64(rawKey)); } catch (e) {}
        var html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      });
  }

  // El fondo se pone cuando terminó de cargar; si falla queda el degradado.
  var background = new Image();
  background.onload = function () {
    var bg = document.getElementById('gate-bg');
    if (bg) bg.style.backgroundImage = "url('assets/login-bg.jpg')";
  };
  background.src = 'assets/login-bg.jpg';

  var form = document.getElementById('gate');
  var input = document.getElementById('gate-password');
  var submit = document.getElementById('gate-submit');
  var error = document.getElementById('gate-error');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!window.crypto || !crypto.subtle) { error.textContent = 'Este navegador no puede abrir el tablero.'; return; }
    submit.disabled = true;
    error.textContent = '';
    derive(input.value).then(show).catch(function () {
      submit.disabled = false;
      error.textContent = 'Contraseña incorrecta';
      input.select();
    });
  });

  // Con la llave de esta sesión se abre solo, pero después de 'load': si document.open() corre con el parser
  // todavía activo no reemplaza la página y el tablero se mezcla con este formulario.
  var saved = null;
  try { saved = sessionStorage.getItem(storageKey); } catch (e) {}
  if (saved) {
    document.body.style.visibility = 'hidden';
    window.addEventListener('load', function () {
      show(bytes(saved)).catch(function () {
        try { sessionStorage.removeItem(storageKey); } catch (e) {}
        document.body.style.visibility = '';
      });
    }, { once: true });
  }
})();
</script>
</body>
</html>
